name: Entdecken aktualisieren
on:
  schedule:
    - cron: '35 12,21 * * 1-5'   # werktags 2x (UTC), nach US-Boersenstart und -schluss
    - cron: '35 10 * * 6'         # Samstag 1x
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aktien-radar-daten
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  entdecken:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Entdecken-Listen bauen (Yahoo, optional 1 Gemini-Aufruf)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/entdecken.py
      - name: Bisherige Audios holen (Branch audio)
        continue-on-error: true
        run: |
          mkdir -p data/audio
          if git fetch -q --depth=1 origin audio:refs/remotes/origin/audio; then git archive refs/remotes/origin/audio data/audio | tar -x; else echo "noch kein Audio-Branch"; fi
      - name: Entdecken-Audio (edge-tts, de-CH-LeniNeural)
        continue-on-error: true
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          pip install -q edge-tts || echo "edge-tts nicht installierbar"
          python scripts/ent_tts.py
      - name: Audio veroeffentlichen (Branch audio, Startseite + Entdecken)
        continue-on-error: true
        run: bash scripts/audio_publish.sh
      - name: Committen
        run: |
          git config user.name "aktien-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/entdecken.json
          for f in data/audio/index.json data/audio/ent/index.json data/podcast.json data/redakteur.json; do [ -f $f ] && git add $f; done
          if git diff --cached --quiet; then echo "keine Aenderung"; exit 0; fi
          git commit -m "Entdecken $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash -q
          git push
