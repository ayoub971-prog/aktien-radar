name: Watchlist aendern (per Issue)
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: aktien-radar-daten
  cancel-in-progress: false
jobs:
  apply:
    # nur der Repo-Besitzer, nur Issues mit Titel "Watchlist:"
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Watchlist:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aenderung anwenden
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/apply_issue.py
      - name: Daten holen
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/fetch_data.py
      - name: Committen
        run: |
          git config user.name "aktien-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watchlist.json data/quotes.json data/news.json data/insights.json data/translations.json
          if git diff --cached --quiet; then echo "keine Aenderung"; exit 0; fi
          git commit -m "Watchlist per Issue #${{ github.event.issue.number }} aktualisiert"
          git pull --rebase -q
          git push
      - name: Antwort und schliessen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/summary.md
          gh issue close ${{ github.event.issue.number }}
