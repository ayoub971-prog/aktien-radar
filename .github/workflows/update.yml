name: Daten aktualisieren
on:
  schedule:
    - cron: '7,27,47 5-22 * * 1-5'   # Werktags tagsueber alle 20 Min (UTC)
    - cron: '17 0-4,23 * * 1-5'       # Werktags nachts stuendlich
    - cron: '17 * * * 0,6'            # Wochenende stuendlich
  workflow_dispatch:
    inputs:
      ai_max_calls:
        description: 'Max. KI-Aufrufe in diesem Lauf'
        default: '12'
      tts_max_calls:
        description: 'Max. Gemini-Stimme-Aufrufe in diesem Lauf'
        default: '3'
permissions:
  contents: write
concurrency:
  group: aktien-radar-daten
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kurse und Nachrichten holen
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MAX_CALLS: ${{ inputs.ai_max_calls || '12' }}
        run: python scripts/fetch_data.py
      - name: Gemini-Vorlesestimme (MP3)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_MAX_CALLS: ${{ inputs.tts_max_calls || '3' }}
        run: python scripts/tts.py
      - name: Aenderungen committen
        run: |
          git config user.name "aktien-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/quotes.json data/news.json data/insights.json data/translations.json
          if [ -f data/ai.json ]; then git add data/ai.json; fi
          if [ -d data/audio ]; then git add data/audio; fi
          if git diff --cached --quiet; then echo "keine Aenderung"; exit 0; fi
          git commit -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
