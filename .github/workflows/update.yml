name: Daten aktualisieren
on:
  schedule:
    - cron: '7,27,47 5-22 * * 1-5'   # Werktags tagsueber alle 20 Min (UTC)
    - cron: '17 0-4,23 * * 1-5'       # Werktags nachts stuendlich
    - cron: '17 * * * 0,6'            # Wochenende stuendlich
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aktien-radar-daten
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kurse und Nachrichten holen
        run: python scripts/fetch_data.py
      - name: Aenderungen committen
        run: |
          git config user.name "aktien-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/quotes.json data/news.json data/insights.json
          if git diff --cached --quiet; then echo "keine Aenderung"; exit 0; fi
          git commit -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
